<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password — Auralis Insights</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts & Icons (consistent with signup/login/OTP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
  :root {
      --primary: #0B3B4B;
      --primary-mid: #1D5A6D;
      --primary-light: #2C6F84;
      --primary-pale: #E3F0F5;
      --accent: #4A9B8D;
      --bg: #F8F9FC;
      --bg2: #EDF2F7;
      --card-bg: rgba(255,255,255,0.92);
      --text-dark: #1A2B3C;
      --text-soft: #3A4A5E;
      --text-muted: #5E6F88;
      --border: rgba(11,59,75,0.10);
      --border-strong: rgba(11,59,75,0.18);
      --shadow-sm: 0 2px 8px rgba(11,59,75,0.07);
      --shadow-md: 0 6px 24px rgba(11,59,75,0.10);
      --shadow-lg: 0 16px 48px rgba(11,59,75,0.13);
      --radius: 14px;
      --radius-lg: 20px;
      --transition: all 0.20s cubic-bezier(0.4,0,0.2,1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 60% 50% at 5% 10%, rgba(127,176,105,0.13), transparent),
        radial-gradient(ellipse 50% 60% at 95% 85%, rgba(46,77,49,0.10), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-radius: 32px;
      padding: 48px 44px;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255,255,255,0.5);
      text-align: center;
      position: relative;
      z-index: 1;
      animation: fadeInUp 400ms ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      margin-bottom: 28px;
    }

    .logo h1 {
      font-size: 30px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }

    .logo span {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    h2 {
      font-size: 24px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .description {
      font-size: 14px;
      color: var(--text-soft);
      margin-bottom: 28px;
      line-height: 1.6;
      max-width: 280px;
      margin-left: auto;
      margin-right: auto;
    }

    /* message styles (consistent with login/signup) */
    .message-container {
      margin-bottom: 24px;
    }
    .message {
      padding: 12px 18px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
    }
    .message.error { 
      color: #B91C1C; 
      background: rgba(185,28,28,0.08); 
      border-left: 4px solid #B91C1C;
    }
    .message.success { 
      color: var(--primary); 
      background: var(--primary-pale); 
      border-left: 4px solid var(--primary);
    }
    .message i { font-size: 14px; }

    .form-group {
      margin-bottom: 24px;
      text-align: left;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 6px;
      display: block;
      letter-spacing: 0.3px;
    }

    .input-wrapper {
      position: relative;
      transition: var(--transition);
    }

    input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      border: 1.5px solid var(--border-strong);
      border-radius: 16px;
      font-size: 15px;
      background: rgba(255,255,255,0.9);
      transition: var(--transition);
      font-family: 'DM Sans', sans-serif;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(46,77,49,0.12);
    }

    .input-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      border-radius: 999px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 12px rgba(46,77,49,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-primary:hover {
      background: var(--primary-mid);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(46,77,49,0.3);
    }

    .btn-primary i {
      font-size: 15px;
    }

    .back-link {
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .back-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid transparent;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-link a:hover {
      border-bottom-color: var(--primary);
    }

    /* email chip (optional, for extra polish) */
    .email-chip {
      background: var(--primary-pale);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
      border: 1px solid rgba(46,77,49,0.15);
    }
  </style>
</head>

<body>

<div class="card">
  <div class="logo">
    <h1>Auralis Insights</h1>
    <span>Calm Intelligence · Clear Decisions</span>
  </div>

  <h2>Forgot password?</h2>
  <div class="description">
    Enter your registered email address. We’ll send you a secure link to reset your password.
  </div>

  <!-- messages (preserved functionality) -->
  {% if messages %}
    <div class="message-container">
      {% for message in messages %}
        <div class="message {{ message.tags }}">
          <i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% else %}fa-check-circle{% endif %}"></i>
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label>Email address</label>
      <div class="input-wrapper">
        <i class="fas fa-envelope input-icon"></i>
        <input type="email" name="email" placeholder="your@email.com" required>
      </div>
    </div>

    <button type="submit" class="btn-primary">
      <i class="fas fa-paper-plane"></i> Send Reset Link
    </button>
  </form>

  <div class="back-link">
    <a href="{% url 'login' %}">
      <i class="fas fa-arrow-left"></i> Back to Login
    </a>
  </div>
</div>

</body>
</html>
