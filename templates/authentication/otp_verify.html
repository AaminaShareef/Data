<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP — Auralis Insights</title>
  <!-- Fonts & Icons (same as signup) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
  :root {
      --primary: #0B3B4B;
      --primary-mid: #1D5A6D;
      --primary-light: #2C6F84;
      --primary-pale: #E3F0F5;
      --accent: #4A9B8D;
      --bg: #F8F9FC;
      --bg2: #EDF2F7;
      --card-bg: rgba(255,255,255,0.92);
      --text-dark: #1A2B3C;
      --text-soft: #3A4A5E;
      --text-muted: #5E6F88;
      --border: rgba(11,59,75,0.10);
      --border-strong: rgba(11,59,75,0.18);
      --shadow-sm: 0 2px 8px rgba(11,59,75,0.07);
      --shadow-md: 0 6px 24px rgba(11,59,75,0.10);
      --shadow-lg: 0 16px 48px rgba(11,59,75,0.13);
      --radius: 14px;
      --radius-lg: 20px;
      --transition: all 0.20s cubic-bezier(0.4,0,0.2,1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 60% 50% at 5% 10%, rgba(127,176,105,0.13), transparent),
        radial-gradient(ellipse 50% 60% at 95% 85%, rgba(46,77,49,0.10), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      background: var(--card-bg);
      border-radius: 32px;
      padding: 48px 44px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.5);
      width: 100%;
      max-width: 460px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .logo {
      margin-bottom: 28px;
    }

    .logo h1 {
      font-size: 30px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .subtitle i {
      color: var(--accent);
      margin-right: 6px;
    }

    .otp-input {
      width: 100%;
      padding: 16px 14px;
      font-size: 28px;
      font-weight: 600;
      font-family: 'DM Mono', monospace;
      text-align: center;
      border: 1.5px solid var(--border-strong);
      border-radius: 18px;
      background: rgba(255,255,255,0.9);
      letter-spacing: 8px;
      transition: var(--transition);
      margin: 16px 0 8px;
    }

    .otp-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(46,77,49,0.12);
    }

    .hint {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 16px 0 8px;
    }
    .hint i {
      color: var(--accent);
      font-size: 13px;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      margin-top: 20px;
      transition: var(--transition);
      box-shadow: 0 4px 12px rgba(46,77,49,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background: var(--primary-mid);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(46,77,49,0.3);
    }

    .btn-primary i {
      font-size: 15px;
    }

    .resend {
      margin-top: 28px;
      font-size: 14px;
      color: var(--text-soft);
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .resend a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
      margin-left: 6px;
      border-bottom: 1px solid transparent;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .resend a:hover {
      border-bottom-color: var(--primary);
    }

    .error {
      color: #B91C1C;
      font-weight: 500;
      font-size: 13px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(185,28,28,0.08);
      padding: 10px 14px;
      border-radius: var(--radius);
      border-left: 4px solid #B91C1C;
    }

    /* email chip */
    .email-chip {
      background: var(--primary-pale);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0 12px;
      border: 1px solid rgba(46,77,49,0.15);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Auralis Insights</h1>
      <div class="subtitle">
        <i class="fas fa-shield-alt"></i> Verify your email
      </div>
    </div>

    <!-- Email chip (consistent with signup theme) -->
    <div class="email-chip">
      <i class="fas fa-envelope"></i>
      {{ email }}
    </div>

    <form id="otpForm" method="post">
      {% csrf_token %}
      
      <input type="text" 
             name="otp" 
             id="otp" 
             class="otp-input" 
             maxlength="6" 
             placeholder="••••••" 
             autocomplete="off"
             required>
      
      <div class="hint">
        <i class="fas fa-clock"></i> Code expires in 10 minutes
      </div>

      {% if error %}
        <div class="error">
          <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
      {% endif %}

      <button type="submit" class="btn-primary">
        <i class="fas fa-check-circle"></i> Verify OTP
      </button>
    </form>

    
  </div>

  <script>
    // Auto-focus & auto-submit on 6 digits
    document.getElementById('otp').addEventListener('input', function(e) {
      const val = e.target.value;
      if (val.length === 6) {
        document.getElementById('otpForm').submit();
      }
    });

    // Resend OTP (preserved functionality)
    document.getElementById('resendBtn').addEventListener('click', function(e) {
      e.preventDefault();
      fetch('/accounts/resend-otp/', {
        method: 'POST',
        headers: { 
          'X-CSRFToken': '{{ csrf_token }}',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email: '{{ email }}' })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          alert('OTP resent successfully.');
        } else {
          alert('Failed to resend OTP: ' + data.error);
        }
      });
    });
  </script>
</body>
</html>
