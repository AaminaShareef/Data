{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KPI Dashboard — Auralis Insights</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --primary:       #2E4D31;
  --primary-mid:   #3d6641;
  --primary-light: #557A59;
  --primary-pale:  #EAF2EB;
  --accent:        #7FB069;
  --bg:            #F5EEE6;
  --bg2:           #EDE6DC;
  --card:          #FFFFFF;
  --text:          #1E1E1E;
  --text-soft:     #4A5568;
  --muted:         #8A9E8D;
  --border:        rgba(46,77,49,0.10);
  --border-strong: rgba(46,77,49,0.18);
  --shadow-sm:     0 2px 8px rgba(46,77,49,0.07);
  --shadow-md:     0 6px 24px rgba(46,77,49,0.10);
  --shadow-lg:     0 16px 48px rgba(46,77,49,0.13);
  --green:         #22c55e;
  --red:           #ef4444;
  --yellow:        #f59e0b;
  --blue:          #3b82f6;
  --purple:        #8b5cf6;
  --radius:        14px;
  --radius-lg:     20px;
  --transition:    all 0.20s cubic-bezier(0.4,0,0.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
}

body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 5% 10%, rgba(127,176,105,0.13), transparent),
    radial-gradient(ellipse 50% 60% at 95% 85%, rgba(46,77,49,0.10), transparent);
  pointer-events: none; z-index: 0;
}

a { color: var(--primary); text-decoration: none; }

/* ── Topbar ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(14px);
  background: rgba(245,238,230,0.88);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1300px; margin: 0 auto; padding: 0 28px;
  height: 60px; display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo {
  width: 32px; height: 32px; background: var(--primary);
  border-radius: 9px; display: flex; align-items: center; justify-content: center;
}
.brand-logo svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; }
.brand-name { font-size: 17px; font-weight: 700; color: var(--primary); letter-spacing: -0.3px; }
.topbar-nav { display: flex; gap: 6px; }
.nav-link {
  font-size: 13px; font-weight: 500; color: var(--muted);
  padding: 7px 14px; border-radius: 999px; transition: var(--transition);
}
.nav-link:hover { background: var(--primary-pale); color: var(--primary); }

/* ── Page wrap ── */
.page-wrap {
  max-width: 1300px; margin: 0 auto; padding: 28px 28px 72px;
  position: relative; z-index: 1;
}

/* ── Section header ── */
.section-head {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 18px; margin-top: 44px;
}
.section-head:first-of-type { margin-top: 0; }
.section-icon {
  width: 32px; height: 32px; border-radius: 9px;
  background: var(--primary-pale);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.section-icon svg { width: 16px; height: 16px; }
.section-title {
  font-size: 16px; font-weight: 700; color: var(--primary); letter-spacing: -0.2px;
}
.section-divider { flex: 1; height: 1px; background: var(--border); }

/* ── Grid helpers ── */
.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap: 14px; }
.grid-wide  { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px,1fr)); gap: 14px; }
.grid-3col  { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 14px; }

/* ── Domain Banner ── */
.domain-banner {
  border-radius: var(--radius-lg);
  padding: 28px 32px;
  display: flex; align-items: center; gap: 24px;
  position: relative; overflow: hidden;
  box-shadow: var(--shadow-lg);
  border: 1px solid rgba(255,255,255,0.2);
}
.domain-banner::before {
  content: ''; position: absolute; inset: 0;
  background: var(--banner-bg, linear-gradient(135deg, #2E4D31, #557A59));
  opacity: 1;
}
.domain-banner::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 80% at 80% 50%, rgba(255,255,255,0.07), transparent);
}
.domain-banner > * { position: relative; z-index: 1; }
.db-icon { font-size: 48px; flex-shrink: 0; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2)); }
.db-text { flex: 1; }
.db-name {
  font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -0.5px; line-height: 1.1;
}
.db-desc { color: rgba(255,255,255,0.72); font-size: 13px; margin-top: 5px; max-width: 560px; }
.db-badge {
  background: rgba(255,255,255,0.13); border: 1px solid rgba(255,255,255,0.22);
  border-radius: 999px; padding: 8px 18px; font-size: 12px; font-weight: 600;
  color: rgba(255,255,255,0.9); white-space: nowrap; flex-shrink: 0;
}

/* ── Overview strip ── */
.overview-strip {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 10px;
}
.ov-tile {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; text-align: center;
  box-shadow: var(--shadow-sm); transition: var(--transition);
}
.ov-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.ov-val { font-size: 19px; font-weight: 800; color: var(--primary); font-family: 'DM Mono', monospace; }
.ov-lbl { font-size: 10px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

/* ── Quality block ── */
.quality-block {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 24px 28px; box-shadow: var(--shadow-md);
}
.quality-inner { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.quality-grade {
  font-size: 56px; font-weight: 900; line-height: 1;
  width: 90px; height: 90px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.quality-grade-A { background: #EDFAF0; color: #2E7D32; box-shadow: 0 0 0 5px #C8E6C9; }
.quality-grade-B { background: var(--primary-pale); color: var(--primary); box-shadow: 0 0 0 5px #C5DFC8; }
.quality-grade-C { background: #FFF8E1; color: #E65100; box-shadow: 0 0 0 5px #FFE082; }
.quality-grade-D { background: #FBE9E7; color: #BF360C; box-shadow: 0 0 0 5px #FFCCBC; }
.quality-grade-F { background: #FFEBEE; color: #B71C1C; box-shadow: 0 0 0 5px #FFCDD2; }
.quality-dims { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 10px; }
.qm-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-soft); margin-bottom: 5px; }
.qm-label span:last-child { font-weight: 700; color: var(--primary); font-family: 'DM Mono', monospace; }
.qm-track { height: 7px; background: var(--bg2); border-radius: 99px; overflow: hidden; }
.qm-fill { height: 100%; border-radius: 99px; transition: width 0.9s cubic-bezier(0.4,0,0.2,1); }
.quality-summary { color: var(--text-soft); font-size: 12px; margin-top: 10px; line-height: 1.6; max-width: 400px; }
.quality-score-badge {
  text-align: center; background: var(--primary-pale);
  border: 1px solid var(--border-strong); border-radius: var(--radius);
  padding: 14px 22px; min-width: 90px; flex-shrink: 0;
}
.quality-score-num { font-size: 28px; font-weight: 900; color: var(--primary); font-family: 'DM Mono', monospace; line-height: 1; }
.quality-score-lbl { font-size: 10px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }

/* ── Flag tiles ── */
.flag-tiles { display: flex; gap: 10px; flex-wrap: wrap; }
.flag-tile {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 18px;
  display: flex; align-items: center; gap: 13px;
  box-shadow: var(--shadow-sm);
}
.flag-icon { font-size: 26px; }
.flag-num { font-size: 22px; font-weight: 800; font-family: 'DM Mono', monospace; }
.flag-label { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }

/* ── Tab nav ── */
.tab-nav { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
.tab-btn {
  padding: 7px 16px; border-radius: 999px;
  border: 1.5px solid var(--border-strong);
  background: transparent; color: var(--muted);
  font-size: 12px; font-weight: 600; cursor: pointer;
  transition: var(--transition); font-family: 'DM Sans', sans-serif;
}
.tab-btn:hover { background: var(--primary-pale); color: var(--primary); border-color: var(--primary); }
.tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ── KPI Card ── */
.kpi-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px 20px 16px;
  display: flex; flex-direction: column; gap: 6px;
  box-shadow: var(--shadow-sm); transition: var(--transition);
  cursor: default; position: relative; overflow: hidden;
}
.kpi-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.kpi-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--card-accent, var(--primary)); border-radius: 3px 3px 0 0;
}
.kpi-card-header { display: flex; align-items: flex-start; justify-content: space-between; }
.kpi-icon { font-size: 22px; line-height: 1; }
.kpi-trend-icon { font-size: 16px; font-weight: 800; }
.kpi-name {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--muted); font-weight: 700; margin-top: 6px;
}
.kpi-value {
  font-size: 26px; font-weight: 800; letter-spacing: -0.5px;
  color: var(--text); line-height: 1.2; font-family: 'DM Mono', monospace;
}
.kpi-subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; }
.kpi-bg-num {
  position: absolute; right: 12px; bottom: 4px;
  font-size: 56px; font-weight: 900; opacity: 0.04;
  color: var(--primary); pointer-events: none;
  font-family: 'DM Mono', monospace; line-height: 1;
}

/* ── Insight Card ── */
.insight-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 18px 20px;
  display: flex; gap: 14px; align-items: flex-start;
  box-shadow: var(--shadow-sm); transition: var(--transition);
  border-left-width: 3px; border-left-style: solid;
}
.insight-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.insight-icon { font-size: 26px; flex-shrink: 0; margin-top: 1px; }
.insight-body { flex: 1; min-width: 0; }
.insight-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; color: var(--text); }
.insight-desc { font-size: 12px; color: var(--text-soft); line-height: 1.55; }
.insight-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
.insight-badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 700;
}

.strength-sp { border-left-color: var(--green); }
.strength-mp { border-left-color: var(--blue); }
.strength-wp { border-left-color: var(--muted); }
.strength-sn { border-left-color: var(--red); }
.strength-mn { border-left-color: var(--yellow); }

.badge-sp { background: rgba(34,197,94,0.12); color: #16a34a; }
.badge-mp { background: rgba(59,130,246,0.12); color: #2563eb; }
.badge-wp { background: rgba(138,158,141,0.12); color: var(--muted); }
.badge-sn { background: rgba(239,68,68,0.12); color: #dc2626; }
.badge-mn { background: rgba(245,158,11,0.12); color: #d97706; }

/* ── Distribution Card ── */
.dist-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px;
  box-shadow: var(--shadow-sm); transition: var(--transition);
}
.dist-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.dist-name { font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 11px; }
.dist-strip-wrap {
  display: flex; gap: 2px; height: 9px; border-radius: 6px;
  overflow: hidden; margin-bottom: 8px;
}
.dist-seg { flex: 1; }
.dist-s1 { background: #ef4444; }
.dist-s2 { background: #f59e0b; }
.dist-s3 { background: var(--accent); }
.dist-s4 { background: var(--primary-light); }
.dist-s5 { background: var(--primary); }
.dist-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; }
.dist-stats { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
.dist-stat .ds-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
.dist-stat .ds-val { font-size: 13px; font-weight: 700; color: var(--text); font-family: 'DM Mono', monospace; }

/* ── Scroll animations ── */
.fade-in { opacity: 0; transform: translateY(16px); transition: opacity 0.4s, transform 0.4s; }
.fade-in.visible { opacity: 1; transform: translateY(0); }

/* ── Responsive ── */
@media(max-width:700px) {
  .db-badge { display: none; }
  .page-wrap { padding: 16px 16px 60px; }
  .topbar-inner { padding: 0 16px; }
}
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <span class="brand-name">Auralis Insights</span>
    </div>
    <div class="topbar-nav">
      <a href="/" class="nav-link">Dashboard</a>
      <a href="/datasets/" class="nav-link">Datasets</a>
    </div>
  </div>
</div>

<div class="page-wrap">

  <!-- ① Domain Banner -->
  <div id="domain-banner" class="domain-banner fade-in">
    <div class="db-icon" id="db-icon">📊</div>
    <div class="db-text">
      <div class="db-name" id="db-name">Loading…</div>
      <div class="db-desc" id="db-desc"></div>
    </div>
    <div class="db-badge" id="db-badge">— records</div>
  </div>

  <!-- ② Dataset Overview -->
  <div class="section-head" style="margin-top:32px">
    <div class="section-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>
    </div>
    <div class="section-title">Dataset Overview</div>
    <div class="section-divider"></div>
  </div>
  <div class="overview-strip fade-in" id="overview-strip"></div>

  <!-- ③ Data Quality -->
  <div class="section-head">
    <div class="section-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
    </div>
    <div class="section-title">Data Quality Score</div>
    <div class="section-divider"></div>
  </div>
  <div class="quality-block fade-in" id="quality-block">
    <div class="quality-inner">
      <div class="quality-grade" id="quality-grade">—</div>
      <div class="quality-dims" id="quality-row"></div>
      <div id="flag-tiles" class="flag-tiles"></div>
    </div>
    <div class="quality-summary" id="quality-summary" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)"></div>
  </div>

  <!-- ④ Domain KPIs -->
  <div class="section-head">
    <div class="section-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    </div>
    <div class="section-title" id="kpi-section-title">Domain KPIs</div>
    <div class="section-divider"></div>
  </div>
  <div class="tab-nav" id="kpi-tabs">
    <button class="tab-btn active" data-tab="all" onclick="filterKPIs('all',this)">All KPIs</button>
    <button class="tab-btn" data-tab="number" onclick="filterKPIs('number',this)">Counts</button>
    <button class="tab-btn" data-tab="currency" onclick="filterKPIs('currency',this)">Currency</button>
    <button class="tab-btn" data-tab="percent" onclick="filterKPIs('percent',this)">Percentages</button>
  </div>
  <div class="grid-auto fade-in" id="kpi-grid"></div>

  <!-- ⑤ Analytical Insights -->
  <div class="section-head">
    <div class="section-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </div>
    <div class="section-title">Analytical Insights</div>
    <div class="section-divider"></div>
  </div>
  <div class="tab-nav">
    <button class="tab-btn active" onclick="filterInsights('all',this)">All</button>
    <button class="tab-btn" onclick="filterInsights('correlation',this)">Correlations</button>
    <button class="tab-btn" onclick="filterInsights('distribution',this)">Distributions</button>
    <button class="tab-btn" onclick="filterInsights('alert',this)">Alerts</button>
  </div>
  <div class="grid-wide fade-in" id="insight-grid"></div>
  <p id="insight-empty" style="display:none;color:var(--muted);font-size:13px;text-align:center;padding:40px">
    No significant insights found for this dataset.

  <!-- ⑥ Column Distributions -->
  <div class="section-head" id="dist-section-head">
    <div class="section-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 12l-6-6-4 4-3-3"/></svg>
    </div>
    <div class="section-title">Column Distributions</div>
    <div class="section-divider"></div>
  </div>
  <div class="grid-3col fade-in" id="dist-grid"></div>

</div><!-- /page-wrap -->

<script>
const RAW = {{ kpi_result_json|safe }};

/* ── helpers ── */
function fmt(v, format) {
  if (v === null || v === undefined) return '—';
  const n = parseFloat(v);
  if (isNaN(n)) return String(v);
  switch (format) {
    case 'currency':
      return n >= 1_000_000 ? '₹' + (n/1_000_000).toFixed(2) + 'M'
           : n >= 1_000     ? '₹' + (n/1_000).toFixed(1) + 'K'
           : '₹' + n.toFixed(2);
    case 'percent': return n.toFixed(2) + '%';
    default:
      return n >= 1_000_000 ? (n/1_000_000).toFixed(2) + 'M'
           : n >= 1_000     ? (n/1_000).toFixed(1) + 'K'
           : Number.isInteger(n) ? n.toString()
           : n.toFixed(2);
  }
}

function trendIcon(trend) {
  return trend === 'up' ? '↑' : trend === 'down' ? '↓' : '';
}

const DOMAIN_GRADIENTS = {
  sales:     'linear-gradient(135deg,#1a5c1e,#2E4D31)',
  hr:        'linear-gradient(135deg,#3d2e6b,#5B3A8C)',
  finance:   'linear-gradient(135deg,#0d4f3c,#1a7a5e)',
  risk:      'linear-gradient(135deg,#6b2c1a,#9B3E26)',
  education: 'linear-gradient(135deg,#1a3a6b,#2E5598)',
  generic:   'linear-gradient(135deg,#2E4D31,#557A59)',
};

const CARD_ACCENTS = [
  '#2E4D31','#7FB069','#557A59','#E67E22','#3B82F6','#8B5CF6','#10B981','#EF4444'
];

const STRENGTH_CLASS = {
  strong_positive:   'sp',
  moderate_positive: 'mp',
  weak_positive:     'wp',
  strong_negative:   'sn',
  moderate_negative: 'mn',
};
const STRENGTH_LABEL = {
  strong_positive:   'Strong Positive',
  moderate_positive: 'Moderate Positive',
  weak_positive:     'Weak Positive',
  strong_negative:   'Strong Negative',
  moderate_negative: 'Moderate Negative',
};
const TYPE_ICON = { correlation:'🔗', distribution:'📊', alert:'🚨', performance:'📉' };

/* ── scroll reveal ── */
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
  });
}, { threshold: 0.08 });
document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

/* ── BANNER ── */
(function buildBanner() {
  const d   = RAW.domain;
  const sum = RAW.dataset_summary;
  const banner = document.getElementById('domain-banner');
  banner.style.setProperty('--banner-bg', DOMAIN_GRADIENTS[d] || DOMAIN_GRADIENTS.generic);
  const iconMap = { sales:'💰', hr:'👥', finance:'📈', risk:'⚠️', education:'🎓', generic:'📊' };
  document.getElementById('db-icon').textContent  = iconMap[d] || '📊';
  document.getElementById('db-name').textContent  = RAW.domain_display || d.toUpperCase();
  document.getElementById('db-desc').textContent  = RAW.domain_description || '';
  document.getElementById('db-badge').textContent =
    (sum.total_records || '—') + ' records · ' + (sum.total_columns || '—') + ' columns';
})();

/* ── OVERVIEW ── */
(function buildOverview() {
  const sum = RAW.dataset_summary;
  const tiles = [
    ['Total Records',    sum.total_records,          '🗂️'],
    ['Columns',          sum.total_columns,           '📋'],
    ['Numeric Cols',     sum.numeric_columns,         '🔢'],
    ['Category Cols',    sum.categorical_columns,     '🔤'],
    ['Datetime Cols',    sum.datetime_columns,        '📅'],
    ['Dupes Removed',    sum.duplicates_removed,      '🔁'],
    ['Missing Filled',   sum.missing_values_filled,   '🩹'],
    ['IQR Outliers',     sum.iqr_outliers_flagged,    '📐'],
    ['Z-score Outliers', sum.zscore_outliers_flagged, '📊'],
    ['Anomalies',        sum.anomalies_detected,      '🤖'],
  ];
  document.getElementById('overview-strip').innerHTML = tiles.map(([lbl, val, ico]) =>
    `<div class="ov-tile">
      <div class="ov-val">${val ?? '—'}</div>
      <div class="ov-lbl">${ico} ${lbl}</div>
    </div>`
  ).join('');
})();

/* ── QUALITY ── */
(function buildQuality() {
  const qs  = (RAW.dataset_summary || {}).quality_score || {};
  const sum = RAW.dataset_summary || {};

  const grade = qs.grade || '—';
  const gradeColors = { A:'#2E7D32', B:'#2E4D31', C:'#E65100', D:'#BF360C', F:'#B71C1C' };
  const gradeEl = document.getElementById('quality-grade');
  gradeEl.textContent = grade;
  gradeEl.className = 'quality-grade quality-grade-' + (grade !== '—' ? grade : 'F');

  const metrics = [
    ['Completeness', qs.completeness, '#2E4D31'],
    ['Uniqueness',   qs.uniqueness,   '#7FB069'],
    ['Consistency',  qs.consistency,  '#557A59'],
  ];
  document.getElementById('quality-row').innerHTML = metrics.map(([lbl, val, color]) => {
    const pct = val != null ? Number(val).toFixed(1) : '—';
    const w   = val != null ? Math.min(Math.round(val), 100) : 0;
    return `<div class="quality-metric">
      <div class="qm-label"><span>${lbl}</span><span>${pct}%</span></div>
      <div class="qm-track"><div class="qm-fill" style="width:${w}%;background:${color}"></div></div>
    </div>`;
  }).join('');

  document.getElementById('quality-summary').textContent = qs.summary || '';

  // Overall score badge
  const ovr = qs.overall != null ? Number(qs.overall).toFixed(1) : null;
  if (ovr) {
    const badge = document.createElement('div');
    badge.className = 'quality-score-badge';
    badge.innerHTML = `<div class="quality-score-num" style="color:${gradeColors[grade]||'var(--primary)'}">${ovr}</div>
                       <div class="quality-score-lbl">Overall Score</div>`;
    document.getElementById('quality-block').querySelector('.quality-inner').appendChild(badge);
  }

  // Flag tiles
  const flags = [
    ['IQR Outliers',    sum.iqr_outliers_flagged,    '📐', '#E67E22'],
    ['Z-score Outliers',sum.zscore_outliers_flagged,  '📊', '#E67E22'],
    ['Anomalies',       sum.anomalies_detected,       '🤖', '#EF4444'],
  ];
  document.getElementById('flag-tiles').innerHTML = flags.map(([lbl, val, ico, color]) =>
    `<div class="flag-tile">
      <div class="flag-icon">${ico}</div>
      <div>
        <div class="flag-num" style="color:${color}">${val ?? 0}</div>
        <div class="flag-label">${lbl}</div>
      </div>
    </div>`
  ).join('');
})();

/* ── KPI CARDS ── */
let ALL_KPIS = [];
(function buildKPIs() {
  ALL_KPIS = RAW.kpis || [];
  const d = RAW.domain;
  const titleEl = document.getElementById('kpi-section-title');
  const iconMap = { sales:'💰 Sales KPIs', hr:'👥 HR KPIs', finance:'📈 Finance KPIs',
                    risk:'⚠️ Risk KPIs', education:'🎓 Academic KPIs', generic:'📊 Dataset KPIs' };
  titleEl.textContent = iconMap[d] || '📊 KPIs';

  const formats = new Set(ALL_KPIS.map(k => k.format));
  document.querySelectorAll('#kpi-tabs .tab-btn[data-tab]').forEach(btn => {
    if (btn.dataset.tab !== 'all' && !formats.has(btn.dataset.tab)) btn.style.display = 'none';
  });
  renderKPIs(ALL_KPIS);
})();

function renderKPIs(list) {
  const grid = document.getElementById('kpi-grid');
  if (!list.length) {
    grid.innerHTML = '<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px">No KPIs available.</p>';
    return;
  }
  const TREND_COLORS = { up: '#22c55e', down: '#ef4444' };
  grid.innerHTML = list.map((k, i) => {
    const accent   = CARD_ACCENTS[i % CARD_ACCENTS.length];
    const trendClr = TREND_COLORS[k.trend] || '';
    const trendHtml = k.trend
      ? `<span class="kpi-trend-icon" style="color:${trendClr}">${trendIcon(k.trend)}</span>` : '';
    return `<div class="kpi-card fade-in" data-format="${k.format||'number'}" style="--card-accent:${accent}">
      <div class="kpi-card-header">
        <span class="kpi-icon">${k.icon||'📌'}</span>
        ${trendHtml}
      </div>
      <div class="kpi-name">${k.name}</div>
      <div class="kpi-value">${fmt(k.value, k.format)}</div>
      ${k.subtitle ? `<div class="kpi-subtitle">${k.subtitle}</div>` : ''}
      <div class="kpi-bg-num">${i+1}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.kpi-card.fade-in').forEach(el => observer.observe(el));
}

function filterKPIs(tab, btn) {
  document.querySelectorAll('#kpi-tabs .tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderKPIs(tab === 'all' ? ALL_KPIS : ALL_KPIS.filter(k => k.format === tab));
}

/* ── INSIGHTS ── */
let ALL_INSIGHTS = [];
(function buildInsights() {
  ALL_INSIGHTS = RAW.insights || [];
  renderInsights(ALL_INSIGHTS);
})();

function renderInsights(list) {
  const grid  = document.getElementById('insight-grid');
  const empty = document.getElementById('insight-empty');
  if (!list.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  grid.innerHTML = list.map(ins => {
    const sc = STRENGTH_CLASS[ins.strength] || 'wp';
    return `<div class="insight-card strength-${sc} fade-in">
      <div class="insight-icon">${ins.icon || TYPE_ICON[ins.type] || '💡'}</div>
      <div class="insight-body">
        <div class="insight-title">${ins.title}</div>
        <div class="insight-desc">${ins.description}</div>
        <div class="insight-badges">
          ${ins.strength && STRENGTH_LABEL[ins.strength]
            ? `<span class="insight-badge badge-${sc}">${STRENGTH_LABEL[ins.strength]}</span>`
            : `<span class="insight-badge badge-wp">${(ins.type||'').toUpperCase()}</span>`}
          ${ins.r_value != null
            ? `<span class="insight-badge badge-${sc}">r = ${ins.r_value}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.insight-card.fade-in').forEach(el => observer.observe(el));
}

function filterInsights(tab, btn) {
  document.querySelectorAll('[onclick^="filterInsights"]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderInsights(tab === 'all' ? ALL_INSIGHTS : ALL_INSIGHTS.filter(i => i.type === tab));
}

/* ── DISTRIBUTIONS ── */
(function buildDistributions() {
  const dists = RAW.distributions || {};
  const keys  = Object.keys(dists);
  if (!keys.length) {
    document.getElementById('dist-section-head').style.display = 'none';
    return;
  }
  document.getElementById('dist-grid').innerHTML = keys.map(col => {
    const d    = dists[col];
    const lbl  = col.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    const range = d.max - d.min || 1;
    const widths = [
      ((d.p10 - d.min)  / range * 100).toFixed(1),
      ((d.p25 - d.p10)  / range * 100).toFixed(1),
      ((d.p75 - d.p25)  / range * 100).toFixed(1),
      ((d.p90 - d.p75)  / range * 100).toFixed(1),
      ((d.max - d.p90)  / range * 100).toFixed(1),
    ];
    return `<div class="dist-card fade-in">
      <div class="dist-name">${lbl}</div>
      <div class="dist-strip-wrap">
        <div class="dist-seg dist-s1" style="flex:${widths[0]}" title="Min→P10"></div>
        <div class="dist-seg dist-s2" style="flex:${widths[1]}" title="P10→P25"></div>
        <div class="dist-seg dist-s3" style="flex:${widths[2]}" title="P25→P75 (IQR)"></div>
        <div class="dist-seg dist-s4" style="flex:${widths[3]}" title="P75→P90"></div>
        <div class="dist-seg dist-s5" style="flex:${widths[4]}" title="P90→Max"></div>
      </div>
      <div class="dist-labels">
        <span>${d.min}</span><span>P25: ${d.p25}</span>
        <span>Mdn: ${d.p50}</span><span>P75: ${d.p75}</span><span>${d.max}</span>
      </div>
      <div class="dist-stats">
        <div class="dist-stat"><div class="ds-lbl">Mean</div><div class="ds-val">${d.mean}</div></div>
        <div class="dist-stat"><div class="ds-lbl">Std</div><div class="ds-val">${d.std}</div></div>
        <div class="dist-stat"><div class="ds-lbl">Skew</div><div class="ds-val">${d.skew}</div></div>
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.dist-card.fade-in').forEach(el => observer.observe(el));
})();
</script>
</body>
</html>
